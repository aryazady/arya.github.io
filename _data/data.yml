research:
    title: Research Experience
    intro: >
      My primary focus has been on constraint-based reconstruction and analysis within the field of Systems Biology. I have been particularly interested in microbial communities because they show robustness to mutation and other disturbances, and proposed an optimization to find a community with the highest growth rate. To be more specific, I designed a constraint-based optimization regarding a previous work (SteadyCom) that enforces the community to be modular and maximize the growth rate. However, such optimizations are often computationally expensive and time-consuming. 
      <br/><br/>
      Currently, I am working on developing a framework to find the most informative numerical representation of bacterium fluxome to exploit it for the prediction of target objectives. In order to achieve this, we need to employ Deep Neural Networks and meaningful features for metabolic reactions, a project I am actively researching and excited to advance in the future.

